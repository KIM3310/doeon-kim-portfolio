name: production-smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: production-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve production base URL
        run: |
          if [ -n "${PUBLIC_BASE_URL:-}" ]; then
            echo "BASE_URL=$PUBLIC_BASE_URL" >> "$GITHUB_ENV"
          else
            echo "BASE_URL=https://kim3310-doeon-kim-portfolio.pages.dev" >> "$GITHUB_ENV"
          fi

      - name: Smoke test production endpoints
        run: bash scripts/smoke_production.sh "$BASE_URL"
