name: production-smoke

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - pages-auto-deploy
      - github-pages-deploy
    types:
      - completed
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: production-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Resolve production base URL
        run: |
          if [ -n "${PUBLIC_BASE_URL:-}" ]; then
            echo "BASE_URL=$PUBLIC_BASE_URL" >> "$GITHUB_ENV"
          else
            echo "BASE_URL=https://kim3310-doeon-kim-portfolio.pages.dev" >> "$GITHUB_ENV"
          fi

      - name: Smoke test production endpoints
        run: bash scripts/smoke_production.sh "$BASE_URL"

      - name: Verify public selected-work gallery and built assets
        if: always()
        run: node scripts/smoke_static.mjs https://kim3310.github.io/doeon-kim-portfolio/ "Doeon Kim — Selected Work"
