<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">MemoryFlow Lab evidence path</title>
  <desc id="desc">A diagram showing workload traces, memory capacity gates, placement policies, and analytical versus measured validation.</desc>
  <rect width="1280" height="720" fill="#0b1220"/>
  <text x="76" y="92" fill="#f8fafc" font-family="Arial,sans-serif" font-size="46" font-weight="700">MemoryFlow Lab</text>
  <text x="76" y="134" fill="#94a3b8" font-family="Arial,sans-serif" font-size="22">KV-cache memory co-design · reproducible evidence path</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(76 220)"><rect width="245" height="150" rx="20" fill="#172554" stroke="#60a5fa"/><text x="24" y="54" fill="#bfdbfe" font-size="25" font-weight="700">Workload trace</text><text x="24" y="94" fill="#cbd5e1" font-size="18">tokens · layers · cache</text><text x="24" y="121" fill="#cbd5e1" font-size="18">fixture metadata</text></g>
    <path d="M337 295h74" stroke="#60a5fa" stroke-width="5"/><path d="m398 283 18 12-18 12" fill="none" stroke="#60a5fa" stroke-width="5"/>
    <g transform="translate(430 220)"><rect width="245" height="150" rx="20" fill="#172554" stroke="#60a5fa"/><text x="24" y="54" fill="#bfdbfe" font-size="25" font-weight="700">Capacity gate</text><text x="24" y="94" fill="#cbd5e1" font-size="18">HBM fit · spill limits</text><text x="24" y="121" fill="#cbd5e1" font-size="18">data movement</text></g>
    <path d="M691 295h74" stroke="#60a5fa" stroke-width="5"/><path d="m752 283 18 12-18 12" fill="none" stroke="#60a5fa" stroke-width="5"/>
    <g transform="translate(784 220)"><rect width="245" height="150" rx="20" fill="#172554" stroke="#60a5fa"/><text x="24" y="54" fill="#bfdbfe" font-size="25" font-weight="700">Placement policy</text><text x="24" y="94" fill="#cbd5e1" font-size="18">HBM · tiered memory</text><text x="24" y="121" fill="#cbd5e1" font-size="18">near-memory trade-offs</text></g>
    <path d="M1045 295h74" stroke="#60a5fa" stroke-width="5"/><path d="m1106 283 18 12-18 12" fill="none" stroke="#60a5fa" stroke-width="5"/>
    <g transform="translate(76 440)"><rect width="1128" height="150" rx="20" fill="#111827" stroke="#34d399"/><text x="28" y="52" fill="#a7f3d0" font-size="26" font-weight="700">Validation boundary</text><text x="28" y="91" fill="#d1fae5" font-size="20">Analytical predictions are compared with held-out PyTorch GPU measurements where available.</text><text x="28" y="121" fill="#94a3b8" font-size="18">Results retain environment metadata and are not presented as universal hardware performance.</text></g>
  </g>
</svg>
